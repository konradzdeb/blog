[build]
command = "hugo --gc --minify --baseURL=https://www.thefinalartefact.xyz/"
publish = "public"

[build.environment]
HUGO_VERSION = "0.161.1"

[context.production]
command = "hugo --gc --minify --baseURL=https://www.thefinalartefact.xyz/"
[context.production.environment]
HUGO_ENV = "production"

# Make branch and preview builds use their own URL
[context.branch-deploy]
command = "hugo --gc --minify -D --baseURL=$DEPLOY_URL/"

[context.deploy-preview]
command = "hugo --gc --minify -D --baseURL=$DEPLOY_PRIME_URL/"
